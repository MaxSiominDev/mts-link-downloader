name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # mtsdump runs on macOS only, so the suite runs there.
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: brew install ffmpeg
      - run: python -m unittest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
