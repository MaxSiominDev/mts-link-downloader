[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mtsdump"
description = "Builds one audio file from an MTS Link meeting recording"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxim Semin" }]
keywords = ["mts-link", "webinar", "recording", "hls", "ffmpeg", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/MaxSiominDev/mts-link-downloader"
Issues = "https://github.com/MaxSiominDev/mts-link-downloader/issues"

[project.scripts]
mtsdump = "mtsdump.cli:main"

[tool.setuptools]
packages = ["mtsdump"]

[tool.setuptools.dynamic]
version = { attr = "mtsdump.__version__" }

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Every zip in the project walks lists that were built side by side.
ignore = ["B905"]
